name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      # Compile packages when used by tests rather than precompiling everything.
      JULIA_PKG_PRECOMPILE_AUTO: '0'

    steps:
      - uses: actions/checkout@v6

      - name: Configure example logs
        run: echo "DARONE_EXAMPLE_LOG_DIR=$RUNNER_TEMP/darone-example-logs" >> "$GITHUB_ENV"

      - name: Install Fortran and NetCDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran make libnetcdf-dev libnetcdff-dev tcsh

      # Darwin3's bundled Cog generator imports imp (removed in Python 3.12).
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'

      - name: Cache Julia packages and compiled code
        uses: julia-actions/cache@v3
        with:
          delete-old-caches: false

      - name: Install Julia dependencies
        run: julia --project=. -e 'using Pkg; Pkg.instantiate()'

      - name: Prepare pinned Darwin sources through DarOne
        run: |
          # Fetches and validates both commits from darwin-sources.env; it
          # stages a writable configuration outside the pristine source tree.
          julia --project=. -e '
            using DarOne
            darwin = darwin_root()
            config = configuration_root()
            @assert isfile(joinpath(darwin, "tools", "genmake2"))
            @assert isfile(joinpath(config, "code", "SIZE.h"))
            open(ENV["GITHUB_ENV"], "a") do io
              println(io, "DARONE_MITGCM_PATH=", darwin)
              println(io, "DARONE_CONFIG_PATH=", config)
            end
            println("Darwin3: ", darwin, "\nConfiguration: ", config)
          '
          git config --global user.name "DarOne CI"
          git config --global user.email "darone-ci@localhost"

      - name: Test examples (all 16 global tiles, five days)
        run: |
          set -o pipefail
          julia --project=. -e 'using Pkg; Pkg.test()' 2>&1 | tee "$RUNNER_TEMP/package-tests.log"

      - name: Collect model diagnostic inventory on failure
        if: failure()
        run: |
          if [ -d "$DARONE_CONFIG_PATH/run" ]; then
            find "$DARONE_CONFIG_PATH/run" \
              -type f \( -name '3d*' -o -name 'data.diagnostics' \) \
              -printf '%p %s bytes\n' | sort > "$RUNNER_TEMP/darone-diagnostic-inventory.txt"
            head -n 100 "$RUNNER_TEMP/darone-diagnostic-inventory.txt"
          fi
          if [ -f "$DARONE_CONFIG_PATH/build/genmake.log" ]; then
            cp "$DARONE_CONFIG_PATH/build/genmake.log" "$RUNNER_TEMP/darone-genmake.log"
          fi

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: darone-test-logs
          if-no-files-found: ignore
          retention-days: 7
          path: |
            ${{ runner.temp }}/package-tests.log
            ${{ runner.temp }}/darone-diagnostic-inventory.txt
            ${{ runner.temp }}/darone-example-logs/*.log
            ${{ runner.temp }}/darone-global-x*.log
            ${{ runner.temp }}/darone-genmake.log
